{{- $page := . -}}
<nav class="navbar" id="navbar" aria-label="Menu utama">
  <div class="container navbar-inner">
    <button type="button" class="navbar-toggle" aria-expanded="false" aria-controls="nav-list">
      <span class="sr-only">Buka menu</span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
    <ul class="nav-list" id="nav-list">
      {{ range site.Menus.main }}
        {{ $active := or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }}
        {{ if .HasChildren }}
        <li class="has-children{{ if $active }} active{{ end }}">
          <a href="{{ .URL }}" aria-haspopup="true">{{ .Name }} <span class="caret" aria-hidden="true"></span></a>
          <ul class="sub-menu">
            {{ range .Children }}<li><a href="{{ (.Params.href | default .URL) | safeURL }}">{{ .Name }}</a></li>{{ end }}
          </ul>
        </li>
        {{ else }}
        <li class="{{ if or (eq .Name "Promo") .Params.highlight }}promo-button{{ end }}{{ if $active }} active{{ end }}"><a href="{{ (.Params.href | default .URL) | safeURL }}">{{ .Name }}</a></li>
        {{ end }}
      {{ end }}
    </ul>
    <form class="nav-search" action="{{ "cari/" | relURL }}" method="get" role="search">
      <input type="search" name="q" placeholder="Cari wilayah" aria-label="Cari" autocomplete="off">
      <button type="submit" aria-label="Cari"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
    </form>
  </div>
</nav>
