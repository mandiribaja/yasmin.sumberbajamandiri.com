# GANTI baseURL dengan domain/subdomain situs cabang ini.
baseURL = "https://yasmin.sumberbajamandiri.com"
languageCode = "id"
defaultContentLanguage = "id"
title = "Sumber Baja Mandiri Cabang Yasmin Bogor | Toko Besi dan Baja di Cimanggu, Tanah Sereal"
theme = "hugo-bangunan"
summaryLength = "35"
paginate = "12"

# Folder content/<folder>/ sudah menjadi section sendiri, jadi halaman /tags/ dan /categories/
# otomatis tidak diperlukan. Hapus baris ini jika ingin mengaktifkannya.
disableKinds = ["taxonomy", "term"]

# Hugo >= 0.128 memakai [pagination]; `paginate` di atas untuk Hugo lama.
[pagination]
  pagerSize = 12

# Beranda juga menghasilkan /index.json (indeks untuk halaman pencarian /cari/). RSS beranda dimatikan
# karena akan memuat ribuan artikel.
[outputs]
  home = ["HTML", "JSON"]

